<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="30.48mm" height="128.5mm" viewBox="0 0 30.48 128.5">
  <!-- 6 HP panel. Labels are drawn at runtime by the module widget (nanosvg renders no text). -->
  <rect x="0" y="0" width="30.48" height="128.5" fill="#e4e4e2"/>
  <!-- title band -->
  <rect x="0" y="0" width="30.48" height="15.5" fill="#202024"/>
  <rect x="3" y="15.5" width="24.48" height="0.6" fill="#e0901f"/>
  <!-- output band -->
  <rect x="0" y="107" width="30.48" height="21.5" fill="#202024"/>
  <!-- drive group -->
  <rect x="3.5" y="28" width="23.48" height="57" rx="2" fill="#d8d8d6" stroke="#b8b8b6" stroke-width="0.3"/>
</svg>
